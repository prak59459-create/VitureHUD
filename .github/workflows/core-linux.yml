# HUDCore（純粋ロジック）のテスト。Linux で速く回す。
name: core-linux

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: HUDCore tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Rules (capabilities / imports)
        run: bash scripts/check_capabilities.sh
      - name: Build
        run: swift build
      - name: Test
        run: swift test --parallel
